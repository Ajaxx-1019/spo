<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Spotify Brot</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<h1>Spotify Brot</h1>

<div class="search">
  <input id="link" placeholder="Tempel link Spotify (lagu/playlist/album)...">
</div>

<div class="search-row2">
  <select id="source">
    <option value="spotidown">Sumber: SpotiDown</option>
    <option value="soundloaders">Sumber: SoundLoaders</option>
  </select>
  <button onclick="searchLink()">Cari</button>
</div>

<div id="resultHeader"></div>

<div class="playlist-actions" id="listActions">
  <button class="btn-action" id="shuffleBtn" onclick="toggleShuffle()">🔀 Smart Shuffle: OFF</button>
  <button class="btn-action" onclick="playAllFromStart()">▶ Putar Semua</button>
  <button class="btn-action" id="downloadAllBtn" onclick="downloadAllTracks()">⬇ Download Semua</button>
</div>

<div id="trackList"></div>

</div>

<div id="player" class="player">

  <img id="playerCover" class="player-cover" src="" alt="">

  <div class="player-info">
    <div id="playerTitle" class="player-title">Belum ada lagu diputar</div>

    <div class="player-progress">
      <span id="curTime" class="player-time">0:00</span>
      <input type="range" id="seek" class="seek" min="0" max="100" value="0">
      <span id="durTime" class="player-time">0:00</span>
    </div>
  </div>

  <div class="player-controls">
    <button id="prevBtn" class="ctrl-btn" onclick="playPrev()" title="Sebelumnya">⏮</button>
    <button id="playPauseBtn" class="ctrl-btn play" onclick="togglePlay()" title="Putar/Jeda">▶</button>
    <button id="nextBtn" class="ctrl-btn" onclick="playNext()" title="Berikutnya">⏭</button>
    <button id="downloadBtn" class="ctrl-btn" onclick="downloadCurrent()" title="Unduh MP3">⬇</button>
  </div>

</div>

<audio id="audio"></audio>

<script src="script.js"></script>

</body>

</html>
